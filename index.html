<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Justin Trinidad | AT&T Business</title>

  <meta name="description"
        content="Digital business card for Justin Trinidad, Business Sales Executive at AT&T Business.">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 18px;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, Helvetica, sans-serif;

      background:
        radial-gradient(
          circle at top right,
          #00A8E0 0%,
          transparent 35%
        ),
        linear-gradient(
          145deg,
          #001F3F,
          #0057B8 55%,
          #00A8E0
        );
    }


    /* MAIN CARD */

    .card {

      width: 100%;
      max-width: 390px;

      background: rgba(255,255,255,0.98);

      border-radius: 28px;

      padding: 35px 26px 28px;

      text-align: center;

      box-shadow:
        0 25px 60px rgba(0,0,0,.25);

      position: relative;
      overflow: hidden;
    }


    /* BLUE ACCENT */

    .card::before {

      content: "";

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 7px;

      background:
        linear-gradient(
          90deg,
          #0057B8,
          #009FDB,
          #00A8E0
        );
    }


    /* AT&T BUSINESS LOGO */

    .company-logo {

      width: 160px;
      max-height: 60px;

      object-fit: contain;

      margin-bottom: 24px;
    }


    /* PROFILE PHOTO */

    .profile-photo {

      width: 145px;
      height: 145px;

      border-radius: 50%;

      object-fit: cover;

      border: 5px solid white;

      box-shadow:
        0 0 0 4px #009FDB,
        0 10px 25px rgba(0,0,0,.20);

      margin-bottom: 20px;
    }


    /* NAME */

    h1 {

      margin: 5px 0 7px;

      font-size: 29px;

      font-weight: 700;

      color: #111111;
    }


    /* JOB TITLE */

    .title {

      margin: 0;

      font-size: 17px;

      font-weight: 600;

      color: #0057B8;
    }


    /* COMPANY */

    .company {

      margin: 7px 0 24px;

      font-size: 15px;

      color: #666666;
    }


    /* SMALL BLUE DIVIDER */

    .divider {

      width: 55px;

      height: 3px;

      background: #00A8E0;

      border-radius: 10px;

      margin: 0 auto 25px;
    }


    /* BUTTONS */

    .button {

      display: flex;

      align-items: center;
      justify-content: center;

      width: 100%;

      margin: 11px 0;

      padding: 15px;

      border-radius: 13px;

      background: #0057B8;

      color: white;

      font-size: 16px;

      font-weight: 600;

      text-decoration: none;

      transition:
        transform .2s ease,
        box-shadow .2s ease,
        background .2s ease;
    }


    .button:hover {

      background: #003F87;

      transform: translateY(-2px);

      box-shadow:
        0 8px 18px rgba(0,87,184,.25);
    }


    /* SAVE CONTACT BUTTON */

    .save-contact {

      margin-top: 20px;

      background:
        linear-gradient(
          135deg,
          #00A8E0,
          #0057B8
        );

      font-size: 17px;
    }


    .save-contact:hover {

      background:
        linear-gradient(
          135deg,
          #009FDB,
          #003F87
        );
    }


    /* FOOTER */

    .footer {

      margin-top: 23px;

      font-size: 11px;

      color: #999999;

      line-height: 1.5;
    }


    /* MOBILE */

    @media (max-width: 480px) {

      body {
        padding: 20px 14px;
      }

      .card {
        padding: 32px 22px 25px;
      }

      .profile-photo {
        width: 135px;
        height: 135px;
      }

      h1 {
        font-size: 27px;
      }

    }

  </style>

</head>


<body>


  <div class="card">


    <!-- AT&T BUSINESS LOGO -->

    <img
      src="att-business-logo.png"
      alt="AT&T Business"
      class="company-logo"
    >



    <!-- JUSTIN'S PROFILE PHOTO -->

    <img
      src="IMG_1739.jpeg"
      alt="Justin Trinidad"
      class="profile-photo"
    >



    <!-- NAME -->

    <h1>
      Justin Trinidad
    </h1>



    <!-- TITLE -->

    <p class="title">
      Business Sales Executive
    </p>



    <!-- COMPANY -->

    <p class="company">
      AT&T Business
    </p>



    <div class="divider"></div>



    <!-- CALL -->

    <a
      class="button"
      href="tel:+13125047540"
    >
      ☎ Call Me
    </a>



    <!-- EMAIL -->

    <a
      class="button"
      href="mailto:justin.trinidad@att.com"
    >
      ✉ Email Me
    </a>



    <!-- LINKEDIN -->

    <a
      class="button"
      href="https://www.linkedin.com/in/justin-trinidad-2049a582/"
      target="_blank"
      rel="noopener noreferrer"
    >
      in&nbsp;&nbsp; LinkedIn
    </a>



    <!-- SAVE CONTACT -->

    <a
      class="button save-contact"
      href="justin-trinidad.vcf"
      type="text/vcard"
    >
      ＋ Save to Contacts
    </a>



    <!-- FOOTER -->

    <div class="footer">

      AT&T and the Globe logo are registered trademarks
      of AT&T Intellectual Property.

    </div>


  </div>


</body>

</html>
